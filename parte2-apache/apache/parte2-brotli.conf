# El script medir_compresion.sh cambia esta calidad de forma controlada.
<IfModule mod_brotli.c>
    BrotliCompressionQuality 5
    BrotliCompressionWindow 22
    AddOutputFilterByType BROTLI_COMPRESS text/html text/plain text/xml application/xml text/css \
        text/javascript application/javascript application/json image/svg+xml
</IfModule>

