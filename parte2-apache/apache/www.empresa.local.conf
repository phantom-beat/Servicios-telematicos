# =============================================================
# VirtualHost: www.empresa.local
# Parte 2 — Servidor Apache — Servicios Telemáticos
# IP: 192.168.50.10
# =============================================================

<VirtualHost *:80>
    ServerName  www.empresa.local
    ServerAlias empresa.local ftp.empresa.local

    DocumentRoot /var/www/www.empresa.local/html

    # ---- Directorio raíz ----
    <Directory /var/www/www.empresa.local/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # ---- Módulo Rewrite ----
    RewriteEngine On

    # Redirigir /ftp a / (alias CNAME ya lo resuelve el DNS)
    RewriteRule ^/ftp/?(.*)$ /$1 [R=301,L]

    # ---- Cabeceras de seguridad ----
    Header always set X-Content-Type-Options  "nosniff"
    Header always set X-Frame-Options         "SAMEORIGIN"
    Header always set X-XSS-Protection        "1; mode=block"
    Header always set Referrer-Policy         "strict-origin-when-cross-origin"

    # ---- Logs ----
    ErrorLog  ${APACHE_LOG_DIR}/www.empresa.local-error.log
    CustomLog ${APACHE_LOG_DIR}/www.empresa.local-access.log combined

</VirtualHost>
