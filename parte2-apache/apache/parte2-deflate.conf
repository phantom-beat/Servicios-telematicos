# El script medir_compresion.sh cambia este nivel de forma controlada.
<IfModule mod_deflate.c>
    DeflateCompressionLevel 6
    AddOutputFilterByType DEFLATE text/html text/plain text/xml application/xml text/css \
        text/javascript application/javascript application/json image/svg+xml
    SetEnvIfNoCase Request_URI "\.(?:gif|jpe?g|png|webp|mp4|avi|zip|gz|pdf)$" no-gzip dont-vary
</IfModule>

